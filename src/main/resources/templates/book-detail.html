<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}">Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Book Details</h2>
        <a th:href="@{/books}" class="btn btn-sm btn-outline-secondary">← Back</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 fw-bold">ID:</div>
                <div class="col-md-9" th:text="${book.id}">1</div>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-3 fw-bold">Title:</div>
                <div class="col-md-9" th:text="${book.title}">1984</div>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-3 fw-bold">Author:</div>
                <div class="col-md-9" th:text="${book.author}">George Orwell</div>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-3 fw-bold">Status:</div>
                <div class="col-md-9">
                    <span class="badge bg-success">Available</span>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 text-center">
        <button class="btn btn-primary">Borrow</button>
        <button class="btn btn-outline-secondary ms-2">Save</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
