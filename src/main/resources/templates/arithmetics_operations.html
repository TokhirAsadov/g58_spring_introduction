<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body th:with="number=50">
    <h1>50 + 5 = <span th:text="${number} + 5"></span></h1>
    <h1>50 - 5 = <span th:text="${number} - 5"></span></h1>
    <h1>50 * 5 = <span th:text="${number} * 5"></span></h1>
    <h1>50 / 7 = <span th:text="${number} / 7"></span></h1>
    <h1>50 % 7 = <span th:text="${number} % 7"></span></h1>
    <h1>50 div 7 = <span th:text="${number} div 7"></span></h1>
    <h1>50 mod 7 = <span th:text="${number} mod 7"></span></h1>
</body>
</html>
