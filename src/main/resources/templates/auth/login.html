<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(~{::title},~{::link})">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <link rel="stylesheet" href="/css/login.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Optional: Bootstrap container for nav -->
<!-- <nav th:replace="fragments :: navbar"></nav> -->

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0 fw-bold">Login Page</h3>
                    <p class="small mb-0">Enter your credentials to access your account</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div th:if="${errorMessage}" class="mb-3">
                        <div class="alert alert-danger alert-dismissible fade show py-2 px-3 d-flex align-items-center shadow-sm"
                             role="alert"
                             style="border-left: 4px solid #dc3545 !important; max-height: 65px; overflow: hidden;">
                            <div class="flex-shrink-0 me-2">
                                <i class="bi bi-exclamation-circle-fill fs-6"></i>
                            </div>
                            <div class="flex-grow-1" style="font-size: 0.875rem;">
                                <span th:text="${errorMessage}" class="text-truncate d-block"></span>
                            </div>
                            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>
                    <form method="post" class="needs-validation" novalidate>
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <div class="mb-4">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-person-fill text-muted"></i>
                                    </span>
                                <input type="text"
                                       class="form-control border-start-0 ps-0"
                                       id="username"
                                       name="uname"
                                       placeholder="Enter your username"
                                       required>
                            </div>
                            <div class="form-text text-muted small mt-1">
                                Use your registered username
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock-fill text-muted"></i>
                                    </span>
                                <input type="password"
                                       class="form-control border-start-0 ps-0"
                                       id="password"
                                       name="pswd"
                                       placeholder="Enter your password"
                                       required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback">
                                    Please enter your password.
                                </div>
                            </div>
                            <div class="form-text text-muted small mt-1">
                                Must be at least 8 characters long
                            </div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">
                                Remember me
                            </label>
                            <a href="#" class="float-end small text-decoration-none">Forgot password?</a>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold py-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                            <div class="text-center mt-3">
                                <p class="text-muted small mb-2">Don't have an account?</p>
                                <a href="/auth/register" class="btn btn-outline-primary btn-sm">Sign Up Now</a>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3 bg-light">
                    <p class="small text-muted mb-0">
                        &copy; 2026 G58. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

<script>
    // Form validation
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })()

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
    });
</script>
</body>
</html>
