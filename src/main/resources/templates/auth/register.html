<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(~{::title},~{::link})">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Page</title>
    <link rel="stylesheet" href="/css/login.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Optional: Bootstrap container for nav -->
<!-- <nav th:replace="fragments :: navbar"></nav> -->

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0 fw-bold">Create Account</h3>
                    <p class="small mb-0">Join our community today</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <!-- Error message (if needed) -->
                    <!--<div th:if="${errorMessage}" class="mb-3">
                        <div class="alert alert-danger alert-dismissible fade show py-2 px-3 d-flex align-items-center shadow-sm"
                             role="alert"
                             style="border-left: 4px solid #dc3545 !important; max-height: 65px; overflow: hidden;">
                            <div class="flex-shrink-0 me-2">
                                <i class="bi bi-exclamation-circle-fill fs-6"></i>
                            </div>
                            <div class="flex-grow-1" style="font-size: 0.875rem;">
                                <span th:text="${errorMessage}" class="text-truncate d-block"></span>
                            </div>
                            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>-->

                    <form method="post" class="needs-validation" novalidate action="/auth/register">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <!-- Username -->
                        <div class="mb-4">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-person-fill text-muted"></i>
                                </span>
                                <input type="text"
                                       class="form-control border-start-0 ps-0"
                                       id="username"
                                       name="username"
                                       placeholder="Enter username"
                                       required
                                       minlength="3"
                                       maxlength="20">
                                <div class="invalid-feedback">
                                    Username must be 3-20 characters.
                                </div>
                            </div>
                            <div class="form-text text-muted small mt-1">
                                3-20 characters, letters and numbers only
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock-fill text-muted"></i>
                                </span>
                                <input type="password"
                                       class="form-control border-start-0 ps-0"
                                       id="password"
                                       name="password"
                                       placeholder="Enter password"
                                       required
                                       minlength="8">
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback">
                                    Password must be at least 8 characters.
                                </div>
                            </div>
                            <div class="progress mt-2" style="height: 5px;">
                                <div class="progress-bar" id="passwordStrength" role="progressbar" style="width: 0%"></div>
                            </div>
                            <div class="form-text text-muted small mt-1">
                                Must be at least 8 characters long
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock-fill text-muted"></i>
                                </span>
                                <input type="password"
                                       class="form-control border-start-0 ps-0"
                                       id="confirmPassword"
                                       name="confirmPswd"
                                       placeholder="Confirm password"
                                       required>
                                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback">
                                    Passwords do not match.
                                </div>
                            </div>
                        </div>

                        <!-- Terms and Conditions (Optional) -->
                       <!-- <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms">
                                <label class="form-check-label" for="terms">
                                    I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a>
                                </label>
                            </div>
                        </div>-->

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-semibold py-2">
                                <i class="bi bi-person-plus-fill me-2"></i>Create Account
                            </button>
                            <div class="text-center mt-3">
                                <p class="text-muted small mb-2">Already have an account?</p>
                                <a href="/auth/login" class="btn btn-outline-success btn-sm">Sign In Now</a>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3 bg-light">
                    <p class="small text-muted mb-0">
                        &copy; 2026 G58. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

<!-- Custom JavaScript -->
<script>
    // Form validation
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    // Confirm password validation
                    const password = document.getElementById('password');
                    const confirmPassword = document.getElementById('confirmPassword');
                    if (password.value !== confirmPassword.value) {
                        confirmPassword.setCustomValidity("Passwords do not match");
                        confirmPassword.classList.add('is-invalid');
                        event.preventDefault();
                        event.stopPropagation();
                    } else {
                        confirmPassword.setCustomValidity("");
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    // Password strength indicator
    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        const strengthBar = document.getElementById('passwordStrength');
        let strength = 0;

        if (password.length >= 8) strength += 25;
        if (/[A-Z]/.test(password)) strength += 25;
        if (/[0-9]/.test(password)) strength += 25;
        if (/[^A-Za-z0-9]/.test(password)) strength += 25;

        strengthBar.style.width = strength + '%';

        // Change color based on strength
        if (strength < 50) {
            strengthBar.className = 'progress-bar bg-danger';
        } else if (strength < 75) {
            strengthBar.className = 'progress-bar bg-warning';
        } else {
            strengthBar.className = 'progress-bar bg-success';
        }
    });

    // Real-time password confirmation check
    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;

        if (confirmPassword !== '') {
            if (password !== confirmPassword) {
                this.classList.add('is-invalid');
                this.setCustomValidity("Passwords do not match");
            } else {
                this.classList.remove('is-invalid');
                this.setCustomValidity("");
            }
        }
    });

    // Username validation (only alphanumeric)
    document.getElementById('username').addEventListener('input', function() {
        const username = this.value;
        const usernamePattern = /^[a-zA-Z0-9]+$/;

        if (username !== '' && !usernamePattern.test(username)) {
            this.setCustomValidity("Only letters and numbers allowed");
            this.classList.add('is-invalid');
        } else {
            this.setCustomValidity("");
            this.classList.remove('is-invalid');
        }
    });
</script>
</body>
</html>
