<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Books List</h1>

    <div th:if="${not #lists.isEmpty(books)}">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th scope="col">#</th>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <th scope="row" th:text="${book.id}">1</th>
                <td th:text="${book.title}">Book Title</td>
                <td th:text="${book.author}">Author Name</td>
            </tr>
            </tbody>
        </table>

        <div class="alert alert-info text-center">
            Total: <span th:text="${#lists.size(books)}">3</span> books found
        </div>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="alert alert-warning text-center">
        No books found!
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
