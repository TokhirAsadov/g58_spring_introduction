<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(~{::title},~{::link})">
    <title>Each Page</title>
    <link rel="stylesheet" href="">
</head>
<body th:with="number=50">
    <p th:text="|'50 > 5 =' ${number > 5}|"></p>
    <p th:text="|50 gt 5 = ${number gt 5}|"></p>
    <p th:text="|'50 >= 5 =' ${number >= 5}|"></p>
    <p th:text="|50 ge 5 = ${number ge 5}|"></p>
    <p th:text="|'50 < 5 =' ${number < 5}|"></p>
    <p th:text="|50 == 50 = ${number == 50}|"></p>
    <p th:text="|50 eq 50 = ${number eq 50}|"></p>
    <p th:text="|50 != 50 = ${number != 50}|"></p>
    <p th:text="|50 ne 50 = ${number ne 50}|"></p>

</body>
</html>
